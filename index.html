<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>後宮巴掌風雲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{--bg:#e8efec;--card:#f7fbf9;--ink:#1f3236;--sub:#5a7075;--rouge:#b83a52;--gold:#9a6f17;--jade:#2a7a58;--line:#c4d3cf;--track:#d5e1dd;--flash:rgba(184,58,82,.4);--btn:#1f4a4f;--btnink:#f2faf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b1e;--card:#1a2a2e;--ink:#e6efe9;--sub:#93aaa8;--rouge:#ff7f95;--gold:#e2bb62;--jade:#5fcf9a;--line:#2f4448;--track:#26393d;--flash:rgba(255,100,125,.35);--btn:#3d8a8f;--btnink:#0d1a1c}}
:root[data-theme="dark"]{--bg:#111b1e;--card:#1a2a2e;--ink:#e6efe9;--sub:#93aaa8;--rouge:#ff7f95;--gold:#e2bb62;--jade:#5fcf9a;--line:#2f4448;--track:#26393d;--flash:rgba(255,100,125,.35);--btn:#3d8a8f;--btnink:#0d1a1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--sub)}
header b{font-family:"Noto Serif TC","Songti TC",serif;font-size:18px;color:var(--ink);font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#oname{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:20px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;transition:width .5s}
.bar.o i{background:var(--rouge)}.bar.p i{background:var(--jade)}
.num{font-size:12px;color:var(--sub);margin:3px 0 6px;text-align:right}
.chips{display:flex;flex-direction:column;gap:4px}
.chip{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:5px 9px;border-radius:8px;background:var(--track)}
.chip small{color:var(--sub);font-size:12px}.chip.off{opacity:.4;text-decoration:line-through}
#arena{position:relative;height:120px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fig{position:relative;font-size:62px;line-height:1}
.fig.hit::after{content:"";position:absolute;inset:14%;border-radius:50%;background:rgba(220,40,60,.5);animation:fade .9s forwards}
.fig.hit{animation:hit .45s}.fig.dodge{animation:dodge .5s}.fig.glow{animation:glow .9s}
#hand{position:absolute;left:50%;top:34%;margin-left:-22px;font-size:44px;opacity:0;pointer-events:none}
#hand.toO{animation:toO .5s}#hand.toM{animation:toM .5s}
.pop{position:absolute;top:10px;font-size:28px;font-weight:900;font-family:"Noto Serif TC",serif;animation:up 1.2s forwards;pointer-events:none}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-9deg)}40%{transform:translateX(12px) rotate(9deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes dodge{0%{transform:translateY(0);opacity:1}40%{transform:translateY(30px) skewX(14deg);opacity:.3}100%{transform:translateY(0);opacity:1}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px var(--gold))}}
@keyframes toO{0%{opacity:0;transform:translateX(-50px) rotate(-35deg)}30%{opacity:1}60%{opacity:1;transform:translateX(80px) rotate(20deg) scale(1.6)}100%{opacity:0;transform:translateX(100px) scale(1.2)}}
@keyframes toM{0%{opacity:0;transform:translateX(50px) scaleX(-1) rotate(-35deg)}30%{opacity:1}60%{opacity:1;transform:translateX(-80px) scaleX(-1) rotate(20deg) scale(1.6)}100%{opacity:0;transform:translateX(-100px) scaleX(-1) scale(1.2)}}
@keyframes fade{from{opacity:1}to{opacity:0}}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,2px)}50%{transform:translate(6px,-2px)}75%{transform:translate(-4px,0)}}
@keyframes fl{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes big{0%{opacity:0;transform:scale(2)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#app.shake{animation:shake .35s}
#flash{position:fixed;inset:0;background:var(--flash);opacity:0;pointer-events:none}#flash.on{animation:fl .45s}
#big{position:fixed;left:0;right:0;top:32%;text-align:center;font:900 60px "Noto Serif TC","Songti TC",serif;color:var(--rouge);opacity:0;pointer-events:none;text-shadow:0 2px 0 var(--card)}#big.on{animation:big 1.1s}
#banner{min-height:20px;font-size:14px;text-align:center;color:var(--gold)}
#target{text-align:center}
#target small{display:block;font-size:13px;color:var(--sub)}
#tsec{font:900 64px/1.1 "Noto Serif TC","Songti TC",serif;color:var(--ink)}
#tol{font-size:13px;color:var(--sub)}#tol.n{color:var(--rouge);font-weight:700}
#msg{min-height:44px;text-align:center;font-size:14px;line-height:1.5}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
button.sel{border-color:var(--rouge);background:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#go,#obtn{background:var(--btn);color:var(--btnink);border-color:var(--btn);min-height:56px;font-size:18px}
#go.live{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.75}}
#ov{position:fixed;inset:0;background:rgba(10,20,22,.72);display:none;align-items:center;justify-content:center;padding:20px}#ov.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font:900 26px "Noto Serif TC","Songti TC",serif}
.box p{margin:0;font-size:14px;line-height:1.7;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
 <header><b>後宮巴掌風雲</b><span id="st"></span><span id="fl"></span></header>
 <section class="card">
  <div class="row"><span id="oname"></span><span class="tag" id="orank"></span><span class="tag" id="opers"></span></div>
  <div class="bar o"><i id="ohp"></i></div><div class="num" id="ohpn"></div>
  <div class="chips" id="oab"></div>
 </section>
 <section id="arena"><div class="fig" id="me">🎎</div><div id="hand">🖐️</div><div class="fig" id="opp"></div></section>
 <div id="banner"></div>
 <div id="target"><small>目標秒數</small><div id="tsec">–</div><div id="tol"></div></div>
 <div id="msg"></div>
 <div class="acts"><button id="bs">🖐️ 呼巴掌</button><button id="bd">💨 閃避</button></div>
 <button id="go" hidden>開始讀秒</button>
 <section class="card"><div class="row"><b>你</b><span class="num" style="margin:0;margin-left:auto" id="phpn"></span></div><div class="bar p"><i id="php"></i></div></section>
</div>
<div id="flash"></div><div id="big">大勝！</div>
<div id="ov"><div class="box"><h2 id="ot"></h2><p id="ob"></p><button id="obtn"></button></div></div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fx=(el,c,ms)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c);return sleep(ms).then(()=>el.classList.remove(c))};
const AB={narrow:{n:'窄門',d:'判定縮為 ±0.3 秒'},ban_dodge:{n:'禁足',d:'3 回合不能閃避'},ban_slap:{n:'纏繞',d:'3 回合不能呼巴掌'},rage:{n:'鳳威',d:'本回合傷害 +1'},guard:{n:'護身',d:'本回合受傷 -1'},heal:{n:'補湯',d:'回復 2 滴血'}};
const STAGES=[
 {rank:'宮女',av:'🌸',hp:6,ab:[['narrow',3]],names:['小蓮','春桃','翠兒','阿杏']},
 {rank:'答應',av:'🎋',hp:9,ab:[['narrow',3],['guard',3]],names:['柳答應','白答應','蘭答應','梅答應']},
 {rank:'貴人',av:'🌺',hp:12,ab:[['ban_dodge',5],['rage',5]],names:['安貴人','蘇貴人','容貴人','姜貴人']},
 {rank:'貴妃',av:'🦚',hp:15,ab:[['ban_dodge',5],['guard',5],['heal',5]],names:['華貴妃','淑貴妃','純貴妃']},
 {rank:'皇后',av:'👑',hp:24,ab:[['narrow',7],['ban_slap',7],['rage',7]],names:['鳳儀皇后']}
];
const S={stage:0,fails:0,PMAX:12,php:12,ban:{dodge:0,slap:0},phase:'',t0:0};

function ov(t,b,btn,fn){$('ot').textContent=t;$('ob').innerHTML=b;$('obtn').textContent=btn;$('obtn').onclick=()=>{$('ov').classList.remove('on');fn()};$('ov').classList.add('on')}
function pop(txt,side,col){const s=document.createElement('span');s.className='pop';s.textContent=txt;s.style.color=col;s.style[side]='18%';$('arena').appendChild(s);setTimeout(()=>s.remove(),1200)}
function render(){
 const o=S.opp;
 $('st').textContent=`第 ${S.stage+1} 關${S.stage==4?'・Boss':''}`;
 $('fl').textContent=`失敗 ${S.fails} 次`;
 $('oname').textContent=o.name;$('orank').textContent=o.rank;$('opers').textContent=o.pers;
 $('ohp').style.width=Math.max(0,o.hp/o.max*100)+'%';$('ohpn').textContent=`${Math.max(0,o.hp)} / ${o.max}`;
 $('php').style.width=Math.max(0,S.php/S.PMAX*100)+'%';$('phpn').textContent=`${Math.max(0,S.php)} / ${S.PMAX}`;
 $('oab').innerHTML=o.ab.map(a=>`<div class="chip${a.left?'':' off'}"><span>${AB[a.id].n} ×${a.left}</span><small>${AB[a.id].d}</small></div>`).join('');
}
function startStage(){
 const st=STAGES[S.stage],boss=S.stage===4,agg=boss?.5:.25+Math.random()*.55;
 S.opp={name:rnd(st.names),rank:st.rank,hp:st.hp,max:st.hp,agg,pers:boss?'深不可測':agg>.62?'愛出手':agg<.4?'愛閃避':'捉摸不定',ab:st.ab.map(([id,n])=>({id,left:n}))};
 S.ban={dodge:0,slap:0};
 $('opp').textContent=st.av;
 newRound();
}
function newRound(){
 const o=S.opp,r=S.r={tol:.5,rage:0,guard:0,pa:null};let ann='';
 const banned=S.ban.dodge||S.ban.slap;
 if(Math.random()<.4){
  const c=o.ab.filter(a=>a.left>0&&(a.id!=='heal'||o.hp<=o.max-2)&&!(banned&&a.id.startsWith('ban_')));
  if(c.length){
   const a=rnd(c);a.left--;
   if(a.id==='narrow')r.tol=.3;else if(a.id==='rage')r.rage=1;else if(a.id==='guard')r.guard=1;
   else if(a.id==='heal')o.hp=Math.min(o.max,o.hp+2);
   else if(a.id==='ban_dodge')S.ban.dodge=3;else if(a.id==='ban_slap')S.ban.slap=3;
   ann=`${o.name}發動【${AB[a.id].n}】${AB[a.id].d}`;fx($('opp'),'glow',900);
  }
 }
 r.target=(10+Math.floor(Math.random()*21))/10;
 let st='';if(S.ban.dodge)st=`🔒 禁足：還剩 ${S.ban.dodge} 回合不能閃避`;if(S.ban.slap)st=`🔒 纏繞：還剩 ${S.ban.slap} 回合不能呼巴掌`;
 $('banner').innerHTML=(ann?`<b>${ann}</b><br>`:'')+st;
 $('tsec').textContent=r.target.toFixed(1)+' 秒';
 $('tol').textContent=`容許誤差 ±${r.tol} 秒`;$('tol').className=r.tol<.5?'n':'';
 $('bs').disabled=S.ban.slap>0;$('bd').disabled=S.ban.dodge>0;
 $('bs').classList.remove('sel');$('bd').classList.remove('sel');
 $('go').hidden=true;$('go').classList.remove('live');
 $('msg').textContent='先選行動，再按「開始讀秒」，心中默數到目標秒數就按確認。';
 S.phase='pick';render();
}
function pick(a){
 if(S.phase!=='pick'&&S.phase!=='ready')return;
 S.r.pa=a;S.phase='ready';
 $('bs').classList.toggle('sel',a==='slap');$('bd').classList.toggle('sel',a==='dodge');
 $('go').hidden=false;$('go').textContent='開始讀秒';
}
$('bs').onclick=()=>pick('slap');$('bd').onclick=()=>pick('dodge');
$('go').onclick=()=>{
 if(S.phase==='ready'){
  S.phase='count';S.t0=performance.now();
  $('go').textContent='確認';$('go').classList.add('live');
  $('bs').disabled=$('bd').disabled=true;
  $('msg').textContent='默數中…時間到就按確認';
 }else if(S.phase==='count'){
  const el=(performance.now()-S.t0)/1000;
  S.phase='busy';$('go').hidden=true;$('go').classList.remove('live');
  resolve(el);
 }
};
async function slapTo(side,miss){
 const h=$('hand');fx(h,side==='o'?'toO':'toM',500);
 await sleep(280);
 if(!miss){fx($(side==='o'?'opp':'me'),'hit',450);fx($('app'),'shake',350);if(side==='m')fx($('flash'),'on',450)}
 await sleep(300);
}
async function resolve(el){
 const r=S.r,o=S.opp,pa=r.pa,O=$('opp'),M=$('me');
 const diff=el-r.target,ok=Math.abs(diff)<=r.tol+1e-9;
 const oa=Math.random()<o.agg?'slap':'dodge';
 let dO=0,dP=0,heal=0,tag;
 if(pa==='slap'){
  if(oa==='slap'){if(ok){dO=3;dP=1+r.rage;tag='小勝！'}else{dP=3+r.rage;tag='揮空，反被打中'}}
  else{if(ok){dO=3;tag='大勝！'}else tag='揮空，對手閃開了'}
 }else{
  if(oa==='slap'){if(ok){heal=2;tag='閃避成功！'}else{dP=3+r.rage;tag='閃避失敗，被打中'}}
  else tag='雙方都在防備，平手';
 }
 let note='';
 if(dO&&r.guard){dO=Math.max(0,dO-1);note='（護身抵消 1 點）'}
 $('msg').innerHTML=`你讀了 <b>${el.toFixed(2)}</b> 秒，誤差 ${diff>=0?'+':''}${diff.toFixed(2)}，${ok?'✅ 成功':'❌ 失敗'}<br>${o.name}選擇：${oa==='slap'?'呼巴掌':'閃避'}`;
 if(pa==='slap'){
  if(oa==='slap'){await slapTo('o',!ok);await slapTo('m',false)}
  else if(ok){await fx(O,'dodge',280);const b=fx($('big'),'on',1100);await slapTo('o',false);await b}
  else{fx(O,'dodge',500);await slapTo('o',true)}
 }else{
  if(oa==='slap'){if(ok){fx(M,'dodge',500);await slapTo('m',true)}else await slapTo('m',false)}
  else{fx(M,'dodge',500);await fx(O,'dodge',500)}
 }
 o.hp=Math.max(0,o.hp-dO);S.php=Math.min(S.PMAX,Math.max(0,S.php-dP+heal));
 if(dO)pop('-'+dO,'right','var(--rouge)');if(dP)pop('-'+dP,'left','var(--rouge)');if(heal)pop('+'+heal,'left','var(--jade)');
 $('msg').innerHTML+=`<br><b>${tag}</b>${note}`;
 render();await sleep(1200);
 if(o.hp<=0)return win();
 if(S.php<=0)return lose();
 if(S.ban.dodge)S.ban.dodge--;if(S.ban.slap)S.ban.slap--;
 newRound();
}
function win(){
 const o=S.opp;
 if(S.stage===4){
  const f=S.fails,t=f==0?'寵冠六宮':f<=3?'母儀天下':f<=7?'苦盡甘來':'九死一生';
  ov('🎉 通關！',`你擊敗了${o.rank}，坐穩後宮。<br>總共失敗 <b>${f}</b> 次。<br>稱號：<b>${t}</b>`,'再玩一次',()=>{S.fails=0;S.stage=0;S.php=S.PMAX;startStage()});
 }else{
  ov(`擊敗${o.name}！`,`${o.rank}已敗下陣來。<br>休息片刻，回復 4 滴血，前往下一關：${STAGES[S.stage+1].rank}。`,'下一關',()=>{S.stage++;S.php=Math.min(S.PMAX,S.php+4);startStage()});
 }
}
function lose(){
 ov('你敗下陣來',`被${S.opp.name}（${S.opp.rank}）擊倒。<br>接關會回到第 ${S.stage+1} 關，血量回滿，失敗次數 +1。`,'接關',()=>{S.fails++;S.php=S.PMAX;startStage()});
}
ov('後宮巴掌風雲',
 `從宮女一路打到皇后。<br>1. 看目標秒數，選「呼巴掌」或「閃避」。<br>2. 按「開始讀秒」，心中默數，到時按「確認」。<br>3. 誤差在 ±0.5 秒內算成功，對手會用能力改變規則。<br>4. 雙方呼巴掌：對手 -3、你 -1。閃避對手出手：你 +2。呼巴掌打中閃避的對手：對手 -3、你不扣血。<br>5. 讀秒失敗：呼巴掌揮空、閃避被打中（-3）。`,
 '入宮',()=>{S.stage=0;S.php=S.PMAX;startStage()});
</script>
</body>
</html>
